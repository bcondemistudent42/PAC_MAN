[project]
name = "pacman"
version = "0.1.0"
description = "Pacman game for 42 school"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flake8>=7.4.1",
    "mazegenerator",
    "mypy>=2.4.0",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "pydantic>=2.13.5",
    "raylib>=6.0.1.0",
    "ruff>=0.16.8",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff]
line-length = 79
